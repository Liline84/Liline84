<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres | PAULYON</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/media.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div id="header-container"></div>

<main class="main-content">

<section class="content-section">
  <h2>Paramètres</h2>

  <h3>Langue</h3>
  <button data-action="change-lang" data-lang="fr">FR</button>
  <button data-action="change-lang" data-lang="en">EN</button>
  <button data-action="change-lang" data-lang="ht">HT</button>
 

  <h3>Thème</h3>
  <button onclick="document.body.classList.toggle('dark-theme')">
    Mode sombre
  </button>

</section>

</main>

<div id="footer-container"></div>

<script type="module" src="js/main.js"></script>

</body>
</html>
